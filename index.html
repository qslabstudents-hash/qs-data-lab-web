<!DOCTYPE html>

        <circle cx="10" cy="-110" r="12" fill="#57d2e6" stroke="none"></circle>
        <circle cx="-70" cy="-60" r="10" fill="#57d2e6" stroke="none"></circle>
      </g>
      <text x="600" y="540" font-family="'Pretendard',sans-serif" font-size="60" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">QS Lab</text>
      <text x="600" y="600" font-family="'Pretendard',sans-serif" font-size="30" font-weight="500" fill="#7e93a8" text-anchor="middle">Data Management System</text>

<body>
  <div class="app">

    <aside class="sidebar">

        <div class="user__meta">
          <div class="user__name">Jisoo Kim</div>
          <div class="user__role">연구원</div>

    <!-- Main -->
    <main class="main" id="main">
      <div class="loading" id="loading">데이터를 불러오는 중…</div>
    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="js/api.js"></script>
  <script src="js/raman.js"></script>
  <script src="js/app.js"></script>
